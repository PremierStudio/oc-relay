name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN

jobs:
  release:
    # Opt-in switch: flip the repo variable RELEASES_ENABLED to true to
    # activate. (secrets/* can't be evaluated in job-level if; vars can.)
    if: ${{ vars.RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # MUST match the environment named in the npm trusted-publisher config.
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Version, changelog, GitHub release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm via trusted publishing (OIDC)
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${TAG}" ]; then
            echo "no release tag — nothing to publish"; exit 0
          fi
          VER="${TAG#v}"
          REG="$(npm view oc-relay version --silent 2>/dev/null || echo none)"
          echo "tag=${TAG} local=${VER} registry=${REG}"
          if [ "${VER}" = "${REG}" ]; then
            echo "registry already at ${REG} — skipping publish"; exit 0
          fi
          npm pkg set "version=${VER}"
          npm publish --provenance --access public
