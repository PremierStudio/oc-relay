name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # Publishing is opt-in: set the repo variable RELEASES_ENABLED=true
    # (and the NPM_TOKEN secret in the `npm` environment) to activate.
    # secrets/* are not evaluable in job-level if — vars are.
    if: ${{ vars.RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
