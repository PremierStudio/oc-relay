name: demo

on:
  workflow_dispatch:

jobs:
  gif:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Render the GIF with vhs
        run: |
          docker run --rm \
            -v "$PWD:/oc-relay" -w /oc-relay \
            ghcr.io/charmbracelet/vhs:latest demo/demo.tape
      - name: Commit demo/demo.gif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/demo.gif
          git commit -m "chore(demo): re-render demo.gif [skip ci]" || echo "nothing changed"
          git push
